  <style>

  <!-- === Sticky Header === -->
  <header class="site-header" id="siteHeader" aria-label="サイトヘッダー">
    <a href="#hero" class="brand" aria-label="魚魚呑 / TOTOTON">
      <span class="brand-lat">TOTOTON</span>
      <span class="brand-sep">／</span>
      <span style="font-size:13px;letter-spacing:.18em;font-weight:500;">魚魚呑</span>
    </a>
    <a href="#reserve" class="nav-cta">席を予約</a>

  <main>
    <!-- 各セクションは後続タスクで挿入 -->
  </main>
  <!-- === Footer は後続タスクで挿入 === -->

  <script>
    // スクロールリビール
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));

    // スティッキーヘッダーの表示切替（ヒーロー通過後に出現）
    (function(){
      const header = document.getElementById('siteHeader');
      const hero = document.getElementById('hero');
      if (!header || !hero) return;
      let threshold = 0;
      const recompute = () => {
        const rect = hero.getBoundingClientRect();
        threshold = (rect.top + window.scrollY) + hero.offsetHeight - 80;
      };
      recompute();
      window.addEventListener('resize', recompute, { passive: true });
      const onScroll = () => {
        if (window.scrollY > threshold) header.classList.add('is-visible');
        else header.classList.remove('is-visible');
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();
  </script>
